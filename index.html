<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 1.4 | Escenarios interactivos Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene-container"></div>
  <div class="crosshair">+</div>

  <!-- HUD Principal Rediseñado -->
  <section class="hud card border-0 shadow-lg text-white p-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h1 class="h5 mb-0 text-cyan">FPS Physical Lab</h1>
      <span class="badge bg-info text-dark" id="object-counter">Objetos: 0</span>
    </div>
    <p class="small text-muted mb-2">Haz clic para capturar el mouse y navegar el mapa.</p>
    
    <div class="d-flex flex-wrap gap-2 small mb-2">
      <span><kbd class="key">WASD</kbd> Mover</span>
      <span><kbd class="key">SPACE</kbd> Saltar</span>
      <span><kbd class="key">L-CLICK</kbd> Láser</span>
      <span><kbd class="key">E</kbd> Super Bomba</span>
      <span><kbd class="key">R</kbd> Respawn</span>
    </div>
    
    <div class="progress mt-2" style="height: 6px;">
      <div id="laser-charge" class="progress-bar bg-info" style="width: 100%;"></div>
    </div>
  </section>

  <footer class="app-footer text-center py-2 px-3">
    Programador: NOMBRE DEL ALUMNO · No. de control: XXXXXXXX · Desarrollo de soluciones en ambientes virtuales
  </footer>

  <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
